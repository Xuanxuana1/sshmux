name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binaries
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o sshmux-darwin-amd64 ./cmd/sshmux
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o sshmux-darwin-arm64 ./cmd/sshmux

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sshmux-darwin-amd64
            sshmux-darwin-arm64
          generate_release_notes: true
